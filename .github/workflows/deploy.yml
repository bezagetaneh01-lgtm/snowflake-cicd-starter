name: Deploy to Snowflake (PROD)

# Merge to main promotes through two gated stages: QA first, then PROD.
# Neither runs without a human clicking Approve — see Settings >
# Environments on this repo for who the reviewers are on each one.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-qa:
    name: Deploy migrations to DEMO_QA
    runs-on: ubuntu-latest
    environment: qa
    env:
      TARGET_DATABASE: DEMO_QA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schemachange
        run: pip install -r requirements.txt

      - name: Stage private key
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$RUNNER_TEMP/snowflake_key.p8" >> "$GITHUB_ENV"

      - name: Dry run
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          schemachange deploy \
            --dry-run \
            --config-folder . \
            --snowflake-account "$SNOWFLAKE_ACCOUNT" \
            --snowflake-user "$SNOWFLAKE_USER" \
            --snowflake-role DEPLOY_ROLE \
            --snowflake-warehouse DEPLOY_WH \
            --snowflake-authenticator snowflake_jwt \
            --snowflake-private-key-file "$SNOWFLAKE_PRIVATE_KEY_FILE" \
            --create-change-history-table \
            --change-history-table METADATA.SCHEMACHANGE.CHANGE_HISTORY_QA \
            --vars "{\"database_name\": \"$TARGET_DATABASE\"}"

      - name: Deploy
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          schemachange deploy \
            --config-folder . \
            --snowflake-account "$SNOWFLAKE_ACCOUNT" \
            --snowflake-user "$SNOWFLAKE_USER" \
            --snowflake-role DEPLOY_ROLE \
            --snowflake-warehouse DEPLOY_WH \
            --snowflake-authenticator snowflake_jwt \
            --snowflake-private-key-file "$SNOWFLAKE_PRIVATE_KEY_FILE" \
            --create-change-history-table \
            --change-history-table METADATA.SCHEMACHANGE.CHANGE_HISTORY_QA \
            --vars "{\"database_name\": \"$TARGET_DATABASE\"}"

      - name: Clean up private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_key.p8"

  deploy-prod:
    name: Deploy migrations to DEMO_PROD
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_DATABASE: DEMO_PROD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schemachange
        run: pip install -r requirements.txt

      - name: Stage private key
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$RUNNER_TEMP/snowflake_key.p8" >> "$GITHUB_ENV"

      - name: Dry run
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          schemachange deploy \
            --dry-run \
            --config-folder . \
            --snowflake-account "$SNOWFLAKE_ACCOUNT" \
            --snowflake-user "$SNOWFLAKE_USER" \
            --snowflake-role DEPLOY_ROLE \
            --snowflake-warehouse DEPLOY_WH \
            --snowflake-authenticator snowflake_jwt \
            --snowflake-private-key-file "$SNOWFLAKE_PRIVATE_KEY_FILE" \
            --create-change-history-table \
            --vars "{\"database_name\": \"$TARGET_DATABASE\"}"

      - name: Deploy
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          schemachange deploy \
            --config-folder . \
            --snowflake-account "$SNOWFLAKE_ACCOUNT" \
            --snowflake-user "$SNOWFLAKE_USER" \
            --snowflake-role DEPLOY_ROLE \
            --snowflake-warehouse DEPLOY_WH \
            --snowflake-authenticator snowflake_jwt \
            --snowflake-private-key-file "$SNOWFLAKE_PRIVATE_KEY_FILE" \
            --create-change-history-table \
            --vars "{\"database_name\": \"$TARGET_DATABASE\"}"

      - name: Clean up private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_key.p8"